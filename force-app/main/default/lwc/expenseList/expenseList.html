<template>
    <div class="expenses-layout">
        <aside class="expense-filters" aria-label="Expense filters">
            <div class="panel-title-row">
                <lightning-icon icon-name="utility:filterList" size="x-small"></lightning-icon>
                <h3>Filter</h3>
            </div>

            <lightning-input
                type="search"
                label="Search"
                placeholder="Name, category, group, bank..."
                value={viewModel.searchTerm}
                data-field="searchTerm"
                onchange={handleFilterChange}
            >
            </lightning-input>

            <div class="filter-stack">
                <lightning-input
                    class="date-format-hide"
                    type="date"
                    label="Start Date"
                    value={viewModel.startDate}
                    data-field="startDate"
                    onchange={handleFilterChange}
                >
                </lightning-input>
                <lightning-input
                    class="date-format-hide"
                    type="date"
                    label="End Date"
                    value={viewModel.endDate}
                    data-field="endDate"
                    onchange={handleFilterChange}
                >
                </lightning-input>
                <lightning-combobox
                    label="Category"
                    value={viewModel.categoryId}
                    options={viewModel.categoryOptions}
                    data-field="categoryId"
                    onchange={handleFilterChange}
                >
                </lightning-combobox>
            </div>

            <template lwc:if={viewModel.dateError}>
                <div class="slds-text-color_error slds-m-top_x-small">{viewModel.dateError}</div>
            </template>

            <lightning-button
                class="filter-reset"
                variant="neutral"
                label="Reset Filters"
                icon-name="utility:refresh"
                onclick={handleResetFilters}
            >
            </lightning-button>
        </aside>

        <div class="expenses-panel">
            <div class="expenses-panel-header">
                <div>
                    <p class="slds-text-title slds-m-around_none">{viewModel.periodLabel}</p>
                    <h3>{viewModel.countLabel}</h3>
                </div>
                <div class="expenses-total">
                    <span>Total</span>
                    <strong>{viewModel.formattedTotal}</strong>
                </div>
            </div>

            <div class="expense-body">
                <template lwc:if={viewModel.isLoading}>
                    <section class="expenses-loading slds-box slds-theme_default" aria-busy="true">
                        <lightning-spinner
                            alternative-text="Loading expenses"
                            size="small"
                        ></lightning-spinner>
                    </section>
                </template>
                <template lwc:else>
                    <template lwc:if={viewModel.hasNoRows}>
                        <div class="empty-state">
                            <lightning-icon
                                icon-name={viewModel.emptyIcon}
                                size="medium"
                            ></lightning-icon>
                            <h3>{viewModel.emptyTitle}</h3>
                            <p>{viewModel.emptyMessage}</p>
                            <div class="empty-state-actions">
                                <template lwc:if={viewModel.hasActiveFilters}>
                                    <lightning-button
                                        variant="neutral"
                                        label="Reset Filters"
                                        icon-name="utility:refresh"
                                        onclick={handleResetFilters}
                                    >
                                    </lightning-button>
                                </template>
                                <template lwc:else>
                                    <lightning-button
                                        variant="brand"
                                        label="Add Expense"
                                        icon-name="utility:add"
                                        onclick={handleAddExpense}
                                    >
                                    </lightning-button>
                                </template>
                            </div>
                        </div>
                    </template>
                    <template lwc:else>
                        <template lwc:if={viewModel.hasSelectedRows}>
                            <div class="selection-bar">
                                <span class="selection-count">
                                    {viewModel.selectedCount} row(s) selected
                                </span>
                                <lightning-button
                                    variant="destructive-text"
                                    label="Delete Selected"
                                    icon-name="utility:delete"
                                    onclick={handleBulkExpenseDelete}
                                >
                                </lightning-button>
                            </div>
                        </template>
                        <div class="expense-scroll">
                            <div class="expense-list" aria-label="Expenses">
                                <template for:each={viewModel.dateGroups} for:item="group">
                                    <section key={group.key} class="expense-day">
                                        <div class="expense-day-header">
                                            <div>
                                                <p class="expense-day-label">{group.label}</p>
                                                <p class="expense-day-count">{group.countLabel}</p>
                                            </div>
                                            <strong>{group.totalFormatted}</strong>
                                        </div>

                                        <div class="expense-day-rows">
                                            <template for:each={group.rows} for:item="row">
                                                <article key={row.id} class="expense-row">
                                                    <label
                                                        class="expense-select"
                                                        title="Select expense"
                                                    >
                                                        <input
                                                            type="checkbox"
                                                            data-id={row.id}
                                                            checked={row.isSelected}
                                                            onchange={handleExpenseSelect}
                                                        />
                                                    </label>

                                                    <div class="expense-main">
                                                        <a
                                                            class="expense-name"
                                                            href={row.recordLink}
                                                            target="_blank"
                                                            rel="noopener noreferrer"
                                                        >
                                                            {row.name}
                                                        </a>
                                                        <div class="expense-meta">
                                                            <span>{row.categoryDisplay}</span>
                                                            <span>{row.bankDisplay}</span>
                                                            <span
                                                                >{row.transactionTypeDisplay}</span
                                                            >
                                                        </div>
                                                    </div>

                                                    <div class="expense-when">
                                                        <span>{row.transactionTimeDisplay}</span>
                                                        <span>{row.expenseDateFormatted}</span>
                                                    </div>

                                                    <div class="expense-amount">
                                                        <span>{row.amountFormatted}</span>
                                                        <template lwc:if={row.hasForeignCurrency}>
                                                            <span class="expense-original-amount">
                                                                {row.foreignCurrencySummary}
                                                            </span>
                                                        </template>
                                                    </div>

                                                    <div
                                                        class="expense-actions"
                                                        aria-label="Expense actions"
                                                    >
                                                        <lightning-button-menu
                                                            alternative-text="Expense actions"
                                                            icon-size="x-small"
                                                            menu-alignment="right"
                                                            variant="border-filled"
                                                            data-id={row.id}
                                                            onselect={handleRowAction}
                                                        >
                                                            <lightning-menu-item
                                                                value="edit"
                                                                label="Edit"
                                                                icon-name="utility:edit"
                                                            >
                                                            </lightning-menu-item>
                                                            <lightning-menu-item
                                                                value="duplicate"
                                                                label="Duplicate"
                                                                icon-name="utility:copy_to_clipboard"
                                                            >
                                                            </lightning-menu-item>
                                                            <lightning-menu-item
                                                                value="delete"
                                                                label="Delete"
                                                                icon-name="utility:delete"
                                                            >
                                                            </lightning-menu-item>
                                                        </lightning-button-menu>
                                                    </div>
                                                </article>
                                            </template>
                                        </div>
                                    </section>
                                </template>
                            </div>
                        </div>

                        <div class="expense-table-footer">
                            <span class="table-status">{viewModel.visibleRowsSummary}</span>
                            <template lwc:if={viewModel.hasMoreRows}>
                                <lightning-button
                                    variant="neutral"
                                    label="Load More"
                                    icon-name="utility:chevrondown"
                                    onclick={handleLoadMore}
                                >
                                </lightning-button>
                            </template>
                        </div>
                    </template>
                </template>
            </div>
        </div>
    </div>
</template>
