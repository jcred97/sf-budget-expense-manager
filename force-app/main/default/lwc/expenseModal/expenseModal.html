<template>
    <template lwc:if={isOpen}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="expense-modal-heading"
            class={modalClass}
        >
            <div class="slds-modal__container">
                <button
                    class="slds-button slds-button_icon slds-modal__close"
                    data-modal-close
                    title="Close"
                    disabled={isSubmitting}
                    onclick={handleClose}
                >
                    <lightning-icon icon-name="utility:close" size="small" alternative-text="Close">
                    </lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>

                <header class="slds-modal__header">
                    <h2 id="expense-modal-heading" class="slds-modal__title slds-hyphenate">
                        {modalTitle}
                    </h2>
                </header>

                <lightning-record-edit-form
                    object-api-name="Expense__c"
                    record-id={recordId}
                    onload={handleLoad}
                    onsubmit={handleSubmit}
                    onsuccess={handleSuccess}
                    onerror={handleError}
                >
                    <div
                        class="slds-modal__content slds-p-around_medium"
                        aria-busy={isModalContentLoading}
                    >
                        <template lwc:if={isModalContentLoading}>
                            <div
                                class="slds-is-relative slds-var-p-vertical_xx-large"
                                role="status"
                                aria-live="polite"
                            >
                                <lightning-spinner
                                    alternative-text="Loading expense form"
                                    size="small"
                                ></lightning-spinner>
                            </div>
                        </template>

                        <template lwc:if={formLoadError}>
                            <div
                                class="slds-notify slds-notify_alert slds-alert_error"
                                role="alert"
                                tabindex="-1"
                                data-form-load-error
                            >
                                <span class="slds-assistive-text">Error</span>
                                <div>
                                    <p>{formLoadError}</p>
                                    <p class="slds-var-m-top_x-small">
                                        Close and reopen this dialog to try again.
                                    </p>
                                    <lightning-button
                                        class="slds-var-m-top_small"
                                        data-form-load-close
                                        variant="inverse"
                                        label="Close"
                                        onclick={handleClose}
                                    ></lightning-button>
                                </div>
                            </div>
                        </template>

                        <div class={formFieldsClass} aria-hidden={isFormUnavailable}>
                            <lightning-messages></lightning-messages>
                            <lightning-input-field
                                data-initial-focus
                                field-name="Name"
                                value={fieldValue.Name}
                                disabled={isSubmitting}
                            ></lightning-input-field>
                            <lightning-input
                                class="slds-m-bottom_x-small"
                                type="toggle"
                                label="Paid in another currency"
                                message-toggle-active="Foreign currency"
                                message-toggle-inactive="PHP"
                                checked={isForeignCurrency}
                                disabled={isSubmitting}
                                onchange={handleForeignCurrencyToggle}
                            >
                            </lightning-input>

                            <div class={phpAmountClass}>
                                <lightning-input-field
                                    data-field="phpAmount"
                                    field-name="Amount__c"
                                    value={fieldValue.Amount__c}
                                    disabled={isPhpAmountDisabled}
                                >
                                </lightning-input-field>
                            </div>

                            <section
                                class={foreignCurrencyFieldsClass}
                                aria-hidden={areForeignCurrencyFieldsHidden}
                                aria-labelledby="foreign-currency-heading"
                            >
                                <h3
                                    id="foreign-currency-heading"
                                    class="slds-text-title_caps slds-m-bottom_x-small"
                                >
                                    Foreign Currency Details
                                </h3>
                                <div class="slds-grid slds-wrap slds-gutters_small">
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input
                                            data-fx-input
                                            data-field="originalCurrency"
                                            type="text"
                                            label="Currency code"
                                            value={originalCurrencyCode}
                                            placeholder="e.g. USD"
                                            pattern="[A-Za-z]{3}"
                                            message-when-pattern-mismatch="Enter a 3-letter ISO currency code."
                                            max-length="3"
                                            required
                                            disabled={areForeignCurrencyInputsDisabled}
                                            onchange={handleCurrencyCodeChange}
                                        >
                                        </lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input
                                            data-fx-input
                                            data-field="originalAmount"
                                            type="number"
                                            label="Original amount"
                                            value={originalAmountValue}
                                            min="0.0001"
                                            step="0.0001"
                                            message-when-range-underflow="Enter an amount greater than zero."
                                            required
                                            disabled={areForeignCurrencyInputsDisabled}
                                            onchange={handleOriginalAmountChange}
                                        >
                                        </lightning-input>
                                    </div>
                                </div>
                                <div class="slds-form-element slds-m-top_x-small">
                                    <div class="slds-form-element__label" aria-hidden="true">
                                        <abbr class="slds-required" title="required">*</abbr
                                        >Exchange rate to PHP
                                    </div>
                                    <lightning-helptext
                                        content="PHP per unit of the original currency. Reference rates are estimates; use your bank or card's settled rate when available."
                                    ></lightning-helptext>
                                    <div
                                        class="slds-grid slds-wrap slds-gutters_small slds-grid_vertical-align-start"
                                    >
                                        <div
                                            class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3"
                                        >
                                            <lightning-input
                                                data-fx-input
                                                data-field="exchangeRate"
                                                type="number"
                                                label="Exchange rate to PHP"
                                                variant="label-hidden"
                                                value={exchangeRateValue}
                                                min="0.00000001"
                                                step="0.00000001"
                                                message-when-range-underflow="Enter a rate greater than zero."
                                                required
                                                disabled={areForeignCurrencyInputsDisabled}
                                                onchange={handleExchangeRateChange}
                                            >
                                            </lightning-input>
                                        </div>
                                        <div
                                            class="fx-rate-action slds-col slds-size_1-of-1 slds-medium-size_1-of-3"
                                        >
                                            <lightning-button
                                                type="button"
                                                variant="neutral"
                                                label="Get reference rate"
                                                icon-name="utility:refresh"
                                                disabled={isExchangeRateActionDisabled}
                                                onclick={handleFetchExchangeRate}
                                            >
                                            </lightning-button>
                                        </div>
                                    </div>
                                </div>

                                <template lwc:if={isExchangeRateLoading}>
                                    <div
                                        class="fx-rate-loading"
                                        role="status"
                                        aria-live="polite"
                                        tabindex="-1"
                                        data-exchange-rate-status
                                    >
                                        <lightning-spinner
                                            alternative-text="Loading reference exchange rate"
                                            size="small"
                                        ></lightning-spinner>
                                    </div>
                                </template>

                                <template lwc:if={exchangeRateError}>
                                    <div
                                        class="slds-notify slds-notify_alert slds-alert_error slds-m-top_small"
                                        role="alert"
                                    >
                                        <span class="slds-assistive-text">Exchange rate error</span>
                                        <p>{exchangeRateError}</p>
                                    </div>
                                </template>

                                <template lwc:if={hasConversionPreview}>
                                    <div
                                        class="slds-box slds-box_x-small slds-theme_shade slds-m-top_small"
                                        role="status"
                                        aria-live="polite"
                                    >
                                        <p>
                                            <strong>{formattedOriginalAmount}</strong> ×
                                            {formattedExchangeRate}
                                            PHP/{normalizedOriginalCurrencyCode} =
                                            <strong>{formattedPhpAmount}</strong>
                                        </p>
                                        <p class="slds-text-body_small slds-text-color_weak">
                                            {exchangeRateContext}
                                        </p>
                                    </div>
                                </template>
                            </section>

                            <div class="slds-hide" aria-hidden="true">
                                <lightning-input-field
                                    field-name="Original_Amount__c"
                                    value={fieldValue.Original_Amount__c}
                                    disabled={isSubmitting}
                                ></lightning-input-field>
                                <lightning-input-field
                                    field-name="Original_Currency_Code__c"
                                    value={fieldValue.Original_Currency_Code__c}
                                    disabled={isSubmitting}
                                ></lightning-input-field>
                                <lightning-input-field
                                    field-name="Exchange_Rate_To_PHP__c"
                                    value={fieldValue.Exchange_Rate_To_PHP__c}
                                    disabled={isSubmitting}
                                ></lightning-input-field>
                                <lightning-input-field
                                    field-name="Exchange_Rate_Date__c"
                                    value={fieldValue.Exchange_Rate_Date__c}
                                    disabled={isSubmitting}
                                ></lightning-input-field>
                                <lightning-input-field
                                    field-name="Exchange_Rate_Source__c"
                                    value={fieldValue.Exchange_Rate_Source__c}
                                    disabled={isSubmitting}
                                ></lightning-input-field>
                            </div>
                            <lightning-combobox
                                class="slds-m-bottom_x-small"
                                data-field="category"
                                label="Category"
                                value={categoryValue}
                                options={categoryOptions}
                                placeholder={categoryPlaceholder}
                                required
                                disabled={isCategoryInputDisabled}
                                onchange={handleCategoryChange}
                            >
                            </lightning-combobox>

                            <template lwc:if={categoryOptionsError}>
                                <div
                                    class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small"
                                    role="alert"
                                    tabindex="-1"
                                    data-category-options-error
                                >
                                    <span class="slds-assistive-text">Error</span>
                                    <div
                                        class="slds-grid slds-grid_vertical-align-center slds-wrap slds-grow"
                                    >
                                        <p class="slds-grow">{categoryOptionsError}</p>
                                        <lightning-button
                                            class="slds-var-m-left_small"
                                            variant="inverse"
                                            label="Retry"
                                            onclick={handleRetryCategories}
                                        ></lightning-button>
                                    </div>
                                </div>
                            </template>
                            <template lwc:elseif={hasNoCategories}>
                                <p
                                    class="slds-text-color_weak slds-m-bottom_small"
                                    data-category-empty
                                    role="status"
                                    tabindex="-1"
                                    aria-live="polite"
                                >
                                    {noCategoriesMessage}
                                </p>
                            </template>
                            <div class="slds-grid slds-wrap slds-gutters_small">
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <lightning-input-field
                                        class="date-format-hide"
                                        field-name="Expense_Date__c"
                                        value={fieldValue.Expense_Date__c}
                                        disabled={isSubmitting}
                                        onchange={handleExpenseDateChange}
                                    >
                                    </lightning-input-field>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <lightning-input
                                        class="slds-m-bottom_x-small"
                                        type="time"
                                        label="Transaction Time"
                                        value={transactionTimeValue}
                                        disabled={isSubmitting}
                                        onchange={handleTransactionTimeChange}
                                    >
                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <lightning-input-field
                                        field-name="Transaction_Type__c"
                                        value={fieldValue.Transaction_Type__c}
                                        disabled={isSubmitting}
                                    >
                                    </lightning-input-field>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <lightning-combobox
                                        class="slds-m-bottom_x-small"
                                        data-field="bank"
                                        label="Bank"
                                        value={bankAssignmentValue}
                                        options={bankComboboxOptions}
                                        placeholder={bankPlaceholder}
                                        disabled={isBankInputDisabled}
                                        onchange={handleBankChange}
                                    >
                                    </lightning-combobox>
                                </div>
                            </div>

                            <template lwc:if={bankOptionsLoading}>
                                <div
                                    class="slds-is-relative slds-p-vertical_large"
                                    role="status"
                                    aria-live="polite"
                                >
                                    <lightning-spinner
                                        alternative-text="Loading available banks"
                                        size="small"
                                    >
                                    </lightning-spinner>
                                </div>
                            </template>
                            <template lwc:elseif={bankOptionsError}>
                                <div
                                    class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small"
                                    role="alert"
                                    tabindex="-1"
                                    data-bank-options-error
                                >
                                    <span class="slds-assistive-text">Error</span>
                                    <div
                                        class="slds-grid slds-grid_vertical-align-center slds-wrap slds-grow"
                                    >
                                        <p class="slds-grow">{bankOptionsError}</p>
                                        <lightning-button
                                            class="slds-var-m-left_small"
                                            variant="inverse"
                                            label="Retry"
                                            onclick={handleRetryBanks}
                                        >
                                        </lightning-button>
                                    </div>
                                </div>
                            </template>
                            <template lwc:elseif={hasNoAvailableBanks}>
                                <p
                                    class="slds-text-color_weak slds-m-bottom_small"
                                    role="status"
                                    aria-live="polite"
                                >
                                    {noAvailableBanksMessage}
                                </p>
                            </template>

                            <template lwc:if={bankContextNotice}>
                                <div
                                    class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small"
                                    role="status"
                                    aria-live="polite"
                                >
                                    <span class="slds-assistive-text">Bank notice</span>
                                    <p>{bankContextNotice}</p>
                                </div>
                            </template>
                        </div>
                    </div>

                    <footer class={formFooterClass} aria-hidden={isFormUnavailable}>
                        <lightning-button
                            variant="neutral"
                            label="Cancel"
                            disabled={isSubmitting}
                            onclick={handleClose}
                        >
                        </lightning-button>
                        <template lwc:if={isAddMode}>
                            <lightning-button
                                class="slds-m-left_x-small"
                                variant="neutral"
                                type="submit"
                                label="Save &amp; New"
                                onclick={handleSaveAndNew}
                                disabled={isSaveBlocked}
                            >
                            </lightning-button>
                        </template>
                        <lightning-button
                            class="slds-m-left_x-small"
                            variant="brand"
                            type="submit"
                            label="Save"
                            onclick={handleSave}
                            disabled={isSaveBlocked}
                        >
                        </lightning-button>
                    </footer>
                </lightning-record-edit-form>
            </div>
        </section>
        <div class={backdropClass}></div>
    </template>
</template>
