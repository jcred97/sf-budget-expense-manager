<template>
    <div class="summary-row">
        <template for:each={cardItems} for:item="card">
            <div key={card.key} class="stat-card slds-box slds-theme_default">
                <div class="stat-label">{card.label}</div>
                <div class={card.valueClass} title={card.value}>{card.value}</div>
                <div class="stat-sub">{card.detail}</div>
            </div>
        </template>
    </div>
</template>
