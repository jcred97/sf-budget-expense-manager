<template>
    <div class="budget-expense-manager-page">
        <div class={workspaceShellClass}>
            <aside class="workspace-sidebar" aria-label="Budget and Expense Manager workspace">
                <div class="sidebar-brand">
                    <span class="brand-mark">
                        <lightning-icon icon-name="utility:money" size="x-small"></lightning-icon>
                    </span>
                    <div class="brand-copy">
                        <span class="brand-name">Budget &amp; Expense Manager</span>
                        <span class="brand-caption">{selectedExpenseGroupName}</span>
                    </div>
                    <button
                        class="sidebar-toggle"
                        type="button"
                        title={sidebarToggleTitle}
                        aria-label={sidebarToggleTitle}
                        aria-expanded={sidebarAriaExpanded}
                        onclick={handleSidebarToggle}
                    >
                        <lightning-icon
                            icon-name={sidebarToggleIcon}
                            size="xx-small"
                        ></lightning-icon>
                    </button>
                </div>

                <div class="workspace-context">
                    <lightning-combobox
                        label="Expense Group"
                        value={expenseGroupId}
                        options={expenseGroupOptions}
                        variant="label-hidden"
                        onchange={handleWorkspaceGroupChange}
                    >
                    </lightning-combobox>
                    <span class="context-caption">Current group</span>
                </div>

                <nav class="workspace-nav" aria-label="Budget and Expense Manager views">
                    <template for:each={workspaceNavItems} for:item="item">
                        <button
                            key={item.key}
                            class={item.className}
                            data-view={item.key}
                            aria-current={item.ariaCurrent}
                            title={item.label}
                            onclick={handleViewChange}
                        >
                            <lightning-icon
                                icon-name={item.iconName}
                                size="x-small"
                            ></lightning-icon>
                            <span>{item.label}</span>
                        </button>
                    </template>
                </nav>
            </aside>

            <main class="workspace-main">
                <template lwc:if={isDashboardView}>
                    <section class="workspace-view">
                        <div class="view-header">
                            <div>
                                <h2>{activeViewConfig.title}</h2>
                                <p>{activeViewConfig.subtitle}</p>
                            </div>
                            <div class="view-header-actions">
                                <c-expense-month-navigator
                                    label={selectedMonthLabel}
                                    navigation-label="Dashboard month"
                                    onprevious={handlePreviousMonth}
                                    onnext={handleNextMonth}
                                >
                                </c-expense-month-navigator>
                                <lightning-button
                                    variant="brand"
                                    label="Add Expense"
                                    icon-name="utility:add"
                                    onclick={openExpenseModal}
                                >
                                </lightning-button>
                            </div>
                        </div>

                        <c-expense-dashboard
                            view-model={dashboardViewModel}
                            onretrydashboard={loadDashboard}
                            onviewexpenses={handleViewExpenses}
                        >
                        </c-expense-dashboard>
                    </section>
                </template>
                <template lwc:elseif={isExpensesView}>
                    <section class="workspace-view">
                        <div class="view-header">
                            <div>
                                <h2>{activeViewConfig.title}</h2>
                                <p>{activeViewConfig.subtitle}</p>
                            </div>
                            <div class="view-header-actions">
                                <c-expense-month-navigator
                                    label={selectedMonthLabel}
                                    navigation-label="Expense month"
                                    onprevious={handlePreviousMonth}
                                    onnext={handleNextMonth}
                                >
                                </c-expense-month-navigator>
                                <lightning-button
                                    variant="neutral"
                                    label="Export CSV"
                                    icon-name="utility:download"
                                    onclick={handleExportCsv}
                                    disabled={expensesViewModel.hasNoRows}
                                >
                                </lightning-button>
                                <lightning-button
                                    variant="neutral"
                                    label="Print / PDF"
                                    icon-name="utility:print"
                                    onclick={handlePrint}
                                    disabled={expensesViewModel.hasNoRows}
                                >
                                </lightning-button>
                                <lightning-button
                                    variant="brand"
                                    label="Add Expense"
                                    icon-name="utility:add"
                                    onclick={openExpenseModal}
                                >
                                </lightning-button>
                            </div>
                        </div>

                        <c-expense-list
                            view-model={expensesViewModel}
                            onfilterchange={handleExpenseFilterChange}
                            onresetfilters={handleResetExpenseFilters}
                            onaddexpense={openExpenseModal}
                            onselectionchange={handleExpenseSelect}
                            onrowaction={handleExpenseAction}
                            onbulkdelete={handleBulkExpenseDelete}
                            onloadmore={handleLoadMore}
                        >
                        </c-expense-list>
                    </section>
                </template>

                <template lwc:elseif={isRecurringView}>
                    <section class="workspace-view">
                        <div class="view-header">
                            <div>
                                <h2>{activeViewConfig.title}</h2>
                                <p>{activeViewConfig.subtitle}</p>
                            </div>
                            <div class="view-header-actions">
                                <lightning-button
                                    variant="neutral"
                                    label={runRecurringLabel}
                                    icon-name="utility:play"
                                    onclick={handleRunRecurringExpenses}
                                    disabled={isRunRecurringDisabled}
                                >
                                </lightning-button>
                                <lightning-button
                                    variant="brand"
                                    label="Add Recurring"
                                    icon-name="utility:add"
                                    onclick={openRecurringExpenseModal}
                                    disabled={isAddRecurringDisabled}
                                >
                                </lightning-button>
                            </div>
                        </div>

                        <c-recurring-expenses
                            view-model={recurringExpensesViewModel}
                            onrowaction={handleRecurringExpenseAction}
                        >
                        </c-recurring-expenses>
                    </section>
                </template>
            </main>
        </div>
    </div>

    <c-expense-print-report view-model={expensesViewModel}></c-expense-print-report>

    <c-expense-modal
        is-open={isExpenseModalOpen}
        record-id={editingExpenseId}
        duplicate-data={duplicateExpenseFields}
        category-options={modalCategoryOptions}
        bank-options={modalBankOptions}
        bank-options-loading={isBankOptionsLoading}
        bank-options-error={bankOptionsError}
        current-bank={currentExpenseBank}
        bank-selection-notice={expenseBankNotice}
        selected-expense-group-name={selectedExpenseGroupName}
        onsuccess={handleExpenseSaveSuccess}
        onclose={handleExpenseModalClose}
        onretrybanks={handleRetryBankOptions}
    >
    </c-expense-modal>

    <c-recurring-expense-modal
        is-open={isRecurringExpenseModalOpen}
        record-id={editingRecurringExpenseId}
        category-options={modalCategoryOptions}
        category-options-loading={isCategoriesLoading}
        category-options-error={categoryOptionsError}
        bank-options={bankOptions}
        bank-options-loading={isBankOptionsLoading}
        bank-options-error={bankOptionsError}
        current-bank-label={currentRecurringBankLabel}
        selected-expense-group-name={selectedExpenseGroupName}
        onsuccess={handleRecurringExpenseSaveSuccess}
        onclose={handleRecurringExpenseModalClose}
        onretrybanks={handleRetryBankOptions}
        onretrycategories={handleRetryCategoryOptions}
    >
    </c-recurring-expense-modal>
</template>
